# SPRINT Supabase configuration (local development).
# Docs: https://supabase.com/docs/guides/local-development

project_id = "sprint"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[email]
enabled = true
port = 54325

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://sprint.dev"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external]
enabled = false

[analytics]
enabled = false

[functions]
enabled = true
verify_jwt = true

[[functions]]
name = "calculate-elo"

[[functions]]
name = "generate-session"

[[functions]]
name = "update-athlete"

[[functions]]
name = "process-assessment"

[[storage.buckets]]
name = "videos"
public = false

[[storage.buckets]]
name = "avatars"
public = true